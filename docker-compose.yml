version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: crypto_api_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crypto_api
      POSTGRES_PASSWORD: crypto_api
      POSTGRES_DB: crypto_api
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto_api"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crypto_api_network

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: crypto_api_pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=crypto_api
      - DB_PASSWORD=crypto_api
      - DB_NAME=crypto_api
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=50
      - RESERVE_POOL_SIZE=10
      - AUTH_TYPE=scram-sha-256
      - LISTEN_ADDR=*
      - LISTEN_PORT=6432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U crypto_api"]
      interval: 5s
      timeout: 5s
      retries: 5
    # volumes:
    #   - pgbouncer_data:/etc/pgbouncer
    networks:
      - crypto_api_network

  redis:
    image: redis:8.0-alpine
    container_name: crypto_api_redis
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crypto_api_network

  shared:
    build:
      context: .
      dockerfile: Dockerfile.shared
    container_name: crypto_api_shared
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://crypto_api:crypto_api@postgres:5432/crypto_api
    networks:
      - crypto_api_network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: crypto_api_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      shared:
        condition: service_completed_successfully
    ports:
      - "6800:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://crypto_api:crypto_api@pgbouncer:6432/crypto_api
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - crypto_api_network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: crypto_api_scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      shared:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://crypto_api:crypto_api@pgbouncer:6432/crypto_api
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - crypto_api_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: crypto_api_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      shared:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://crypto_api:crypto_api@pgbouncer:6432/crypto_api
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - crypto_api_network

volumes:
  postgres_data:
  pgbouncer_data:

networks:
  crypto_api_network:
    driver: bridge

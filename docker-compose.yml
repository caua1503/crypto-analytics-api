version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: crypto_api_postgres
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.2
    environment:
      POSTGRES_USER: crypto_api
      POSTGRES_PASSWORD: crypto_api
      POSTGRES_DB: crypto_api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto_api"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crypto_api_network

  postgres_user:
    image: postgres:16
    container_name: crypto_api_postgres_user
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.2
    environment:
      POSTGRES_USER: crypto_user
      POSTGRES_PASSWORD: crypto_user
      POSTGRES_DB: crypto_user
    ports:
      - "5433:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto_user"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crypto_api_network

  pgbouncer_user:
    image: edoburu/pgbouncer:latest
    container_name: crypto_api_pgbouncer_user
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.1
    depends_on:
      postgres_user:
        condition: service_healthy
    ports:
      - "6433:6432"
    environment:
      - DB_HOST=postgres_user
      - DB_PORT=5432
      - DB_USER=crypto_user
      - DB_PASSWORD=crypto_user
      - DB_NAME=crypto_user
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=500
      - DEFAULT_POOL_SIZE=20
      - RESERVE_POOL_SIZE=5
      - AUTH_TYPE=scram-sha-256
      - LISTEN_ADDR=*
      - LISTEN_PORT=6432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U crypto_user"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crypto_api_network

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: crypto_api_pgbouncer
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.1
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:6432"    
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=crypto_api
      - DB_PASSWORD=crypto_api
      - DB_NAME=crypto_api
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=50
      - RESERVE_POOL_SIZE=10
      - AUTH_TYPE=scram-sha-256
      - LISTEN_ADDR=*
      - LISTEN_PORT=6432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432 -U crypto_api"]
      interval: 5s
      timeout: 5s
      retries: 5
    # volumes:
    #   - pgbouncer_data:/etc/pgbouncer
    networks:
      - crypto_api_network

  redis:
    image: redis:8.0-alpine
    container_name: crypto_api_redis
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.1
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crypto_api_network

